<svg xmlns="http://www.w3.org/2000/svg" width="var(--tetris-letter-width)" height="var(--tetris-letter-height)" viewBox="0 10 30 40">
    <title>A built from three falling block pieces</title>
    <style><![CDATA[ .block { width: var(--tetris-letter-block-size); height: var(--tetris-letter-block-size); stroke: var(--tetris-letter-outline-dark);  stroke-width: 1; } ]]></style>
    <g id="upper" fill="var(--tetris-letter-green)">
        <rect class="block" x="0" y="0" />
        <rect class="block" x="10" y="0" />
        <rect class="block" x="20" y="0" />
    </g>
    <g id="stem" fill="var(--tetris-letter-purple)">
        <rect class="block" x="0" y="10" />
        <rect class="block" x="0" y="20" />
        <rect class="block" x="10" y="20" />
        <rect class="block" x="0" y="30" />
    </g>
        <g id="lower" fill="var(--tetris-letter-green)">
        <rect class="block" x="0" y="30" />
        <rect class="block" x="10" y="30" />
        <rect class="block" x="20" y="30" />
    </g>
</svg>
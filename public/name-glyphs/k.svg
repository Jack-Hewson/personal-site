<svg xmlns="http://www.w3.org/2000/svg" width="39" height="49" viewBox="0 0 39 49">
  <title>K built from three falling block pieces</title>
  <style><![CDATA[ .block { stroke: var(--glyph-outline-light); stroke-opacity: .45; stroke-width: .7; } ]]></style>
  <g id="stem" fill="var(--glyph-cyan)">
    <rect class="block" x="0" y="0" width="9" height="9" />
    <rect class="block" x="0" y="10" width="9" height="9" />
    <rect class="block" x="0" y="20" width="9" height="9" />
    <rect class="block" x="0" y="30" width="9" height="9" />
    <rect class="block" x="0" y="40" width="9" height="9" />
  </g>
  <g id="upper" fill="var(--glyph-light-green)">
    <rect class="block" x="20" y="10" width="9" height="9" />
    <rect class="block" x="30" y="10" width="9" height="9" />
    <rect class="block" x="10" y="20" width="9" height="9" />
    <rect class="block" x="20" y="20" width="9" height="9" />
  </g>
  <g id="lower" fill="var(--glyph-coral)">
    <rect class="block" x="10" y="30" width="9" height="9" />
    <rect class="block" x="20" y="30" width="9" height="9" />
    <rect class="block" x="20" y="40" width="9" height="9" />
    <rect class="block" x="30" y="40" width="9" height="9" />
  </g>
</svg>

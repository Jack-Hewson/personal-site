<svg xmlns="http://www.w3.org/2000/svg" width="30" height="40" viewBox="0 0 30 60">
    <title>J built from three falling block pieces</title>
    <style><![CDATA[ .block { width: var(--glyph-block-size); height: var(--glyph-block-size); stroke: var(--glyph-outline-dark);  stroke-width: 1; } ]]></style>
    <g id="hook" fill="var(--glyph-red)">
        <rect class="block" x="10" y="30" />
        <rect class="block" x="10" y="40" />
        <rect class="block" x="20" y="40" />
    </g>
    <g id="stem" fill="var(--glyph-blue-light)">
        <rect class="block" x="30" y="10" />
        <rect class="block" x="30" y="20" />
        <rect class="block" x="30" y="30" />
        <rect class="block" x="30" y="40" />
    </g>
</svg>
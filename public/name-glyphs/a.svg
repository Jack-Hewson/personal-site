<svg xmlns="http://www.w3.org/2000/svg" width="30" height="40" viewBox="0 0 30 40">
    <title>A built from three falling block pieces</title>
    <style><![CDATA[ .block { width: var(--glyph-block-size); height: var(--glyph-block-size); stroke: var(--glyph-outline-dark);  stroke-width: 1; } ]]></style>
    <g id="cap" fill="var(--glyph-green)">
        <rect class="block" x="0" y="10" />
        <rect class="block" x="10" y="10" />
        <rect class="block" x="20" y="10" />
    </g>
    <g id="left" fill="var(--glyph-purple)">
        <rect class="block" x="0" y="20" />
        <rect class="block" x="0" y="30" />
        <rect class="block" x="10" y="30" />
        <rect class="block" x="0" y="40" />
    </g>
    <g id="right" fill="var(--glyph-orange)">
        <rect class="block" x="20" y="20" />
        <rect class="block" x="20" y="30" />
        <rect class="block" x="20" y="40" />
    </g>
</svg>